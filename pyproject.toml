[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-test-framework"
version = "0.1.0"
description = "Automated PLC testing framework"
requires-python = ">=3.10"
dependencies = [
    "python-snap7",
    "pycomm3",
]

[tool.setuptools.packages.find]
where = ["src"]
